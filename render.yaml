services:
  - type: web
    name: alertlens-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /pipeline
    autoDeploy: true
    disk:
      name: alertlens-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
